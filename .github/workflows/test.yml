name: Tests

on:
  push:
  pull_request:

jobs:
  # Python job — intentionally unchanged (P3 scope: C++ build lives in its own
  # job below so a C++ failure never masks the Python signal, and vice versa).
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run unit tests (no API key or faust compiler required)
        run: pytest tests/ -m "not integration" -v
        # NOTE: tests/test_prompt_stdlib.py self-skips here — it needs the Faust
        # stdlib and compiler, which this job deliberately does not install. It is
        # run for real in the build-host job below, which already has both.

  build-host:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        # libfaust — package names checked against packages.ubuntu.com (noble,
        # faust 2.70.3+ds, all in universe):
        #   libsndfile1-dev + codecs -> the render oracle's toolchain. NOT optional
        #                   and NOT implied by the faust package: `faust2sndfile`
        #                   ships with faust, but the C++ it generates does
        #                   `#include <sndfile.h>` and links with
        #                   `pkg-config --static --libs sndfile`. The --STATIC is
        #                   the part that bites: it emits libsndfile's whole
        #                   transitive closure, so every codec needs its own -dev
        #                   package present or ld fails on the first missing one.
        #                   Measured from `pkg-config --static --libs sndfile`:
        #                     -lsndfile -lFLAC -lmp3lame -lmpg123 -logg -lopus
        #                     -lvorbis -lvorbisenc
        #                   Invisible on Arch, where these arrive as libsndfile
        #                   dependencies. Cost two CI round trips (runs 30180544187
        #                   and 30180674842) to surface, the second only because
        #                   render_oracle was reporting the HEAD of the compiler's
        #                   output — all warnings — instead of the tail, where
        #                   "cannot find -lmp3lame" was sitting.
        #   faust        -> /usr/bin/faust AND the unversioned
        #                   /usr/lib/x86_64-linux-gnu/libfaust.so symlink that
        #                   host/CMakeLists.txt's find_library(faust REQUIRED) needs
        #   libfaust2t64 -> libfaust.so.2 runtime
        #   faust-common -> /usr/include/faust headers + /usr/share/faust stdlib
        #                   (stdfaust.lib — needed at ParamPoolTsanTest RUNTIME:
        #                   FaustEngine::compile() passes no -I args, so imports
        #                   resolve via libfaust's built-in default path)
        #
        # JUCE Linux deps — deliberately REDUCED set: host/CMakeLists.txt sets
        # JUCE_WEB_BROWSER=0 / JUCE_USE_CURL=0 via target_compile_definitions
        # (see its comment block), so gtk3/webkit2gtk-4.x/libcurl dev packages
        # are NOT needed here. No juce_opengl module is linked either, so no
        # mesa/GL dev packages. What remains: ALSA (juce_audio_devices),
        # freetype (juce_graphics), X11 + extensions (juce_gui_basics).
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ninja-build pkg-config \
            faust faust-common libfaust2t64 \
            libsndfile1-dev libmp3lame-dev libmpg123-dev libvorbis-dev \
            libflac-dev libopus-dev libogg-dev \
            libasound2-dev \
            libfreetype-dev \
            libx11-dev libxext-dev libxrender-dev libxrandr-dev \
            libxinerama-dev libxcursor-dev libxcomposite-dev \
            xvfb

      # Prompt grounding. This job is the only one with the Faust stdlib and
      # compiler installed, so it is where the anti-fabrication checks can
      # actually run. Placed before the (slower) JUCE build: if the system prompt
      # teaches a function that does not exist, or a few-shot example does not
      # compile, that is worth failing fast on. This is the regression guard for
      # the 2026-07-21 incident (ef.ping_pong / ef.chorus / ef.flanger).
      - name: Set up Python for prompt tests
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify system prompt against the installed Faust stdlib
        run: |
          python -m pip install --upgrade pip
          pip install pytest
          python tools/gen_stdlib_block.py --check
          python tools/gen_stdlib_block.py --verify-prompt
          pytest tests/test_prompt_stdlib.py -v

      # The audio gate. Renders compiled Faust offline and asserts the output is
      # usable — no NaN/Inf, not silent, no DC runaway, no runaway gain — and that
      # a low-pass actually measures as a low-pass (-3 dB at its stated corner).
      # This is the automatable half of the P6 listening battery; the subjective
      # half still needs ears.
      #
      # Runs here rather than in the Python job for the same reason as the prompt
      # checks above: it needs faust2sndfile, which only this job installs. The
      # tests self-skip when it is absent, so they are silently vacuous in the
      # other job — running them for real has to be deliberate, and this is it.
      #
      # numpy/scipy only. Deliberately no torch or librosa: an audio gate heavy
      # enough to be slow in CI is an audio gate that gets disabled.
      - name: Render-and-measure oracle
        run: |
          pip install numpy scipy
          python bench/render_oracle.py --self-test
          pytest tests/test_render_oracle.py -v

      # Pinned to the JUCE version verified working locally (2026-07-18 full
      # build): the local checkout at ~/JUCE is tag 7.0.9. Cache key includes
      # the tag so bumping JUCE invalidates the cache automatically.
      - name: Cache JUCE
        id: cache-juce
        uses: actions/cache@v4
        with:
          path: ~/JUCE
          key: juce-7.0.9

      - name: Clone JUCE
        if: steps.cache-juce.outputs.cache-hit != 'true'
        run: git clone --depth 1 --branch 7.0.9 https://github.com/juce-framework/JUCE.git "$HOME/JUCE"

      # Mirrors README.md "Build the JUCE host plugin" (Debug + JUCE_PATH), with
      # two CI-specific deviations: -G Ninja made explicit (project convention;
      # the runner's default is Unix Makefiles), and a build dir named build-ci
      # so it can never collide with a developer's host/build tree if these
      # steps are ever replicated locally. Note the CMake root is host/, not
      # the repo root.
      - name: Configure
        run: cmake -S host -B build-ci -G Ninja -DCMAKE_BUILD_TYPE=Debug -DJUCE_PATH="$HOME/JUCE"

      # PluginForgeHost is the juce_add_plugin shared-code target; the two
      # format targets and the TSan console app are requested explicitly so a
      # regression in any one of the four fails the job by name.
      - name: Build host targets + TSan test
        run: cmake --build build-ci --target PluginForgeHost PluginForgeHost_Standalone PluginForgeHost_VST3 ParamPoolTsanTest

      # The two behavioural harnesses added 2026-07-25. Both are ASan/UBSan.
      #
      # OfflineRenderTest is the objective half of the P6 listening battery: it
      # renders a corpus through the real JIT + swap protocol + ParamPool +
      # OutputGuard path and asserts finite, non-silent, bounded, DC-free output,
      # plus the PF-018 sample-rate-change spec. It needs NO display — verified
      # locally with DISPLAY and WAYLAND_DISPLAY unset, exit 0.
      #
      # PromptPanelThreadingTest is the PF-006 regression: owned+joined generate
      # worker, supersede, teardown mid-flight. It constructs juce::Components and
      # pumps the message loop, so unlike the above it DOES need a display —
      # verified the hard way: run headless it hangs indefinitely rather than
      # failing, which is why it runs under xvfb below AND under `timeout`.
      - name: Build behavioural test harnesses
        run: cmake --build build-ci --target OfflineRenderTest PromptPanelThreadingTest

      # The audio path's own gate. No network, no API key, no quota: the corpus is
      # hand-written Faust, so this measures the AUDIO path, never generation
      # quality. Five pathological negative controls assert OutputGuard actually
      # latches the right trip, so the safety assertions can be shown to fail.
      - name: Run OfflineRenderTest (objective P6 battery)
        run: |
          BIN="$(find build-ci/OfflineRenderTest_artefacts -type f -name OfflineRenderTest | head -n 1)"
          if [ -z "$BIN" ]; then
            echo "OfflineRenderTest binary not found" >&2
            exit 1
          fi
          timeout 300 "$BIN"

      # xvfb-run -a picks a free display number rather than a fixed :99, so two
      # concurrent jobs on the same runner cannot collide. `timeout` is not
      # belt-and-braces here: without a display this binary HANGS, and a hang in
      # CI burns the job's whole wall-clock budget instead of failing.
      - name: Run PromptPanelThreadingTest (PF-006 regression, under xvfb)
        run: |
          BIN="$(find build-ci/PromptPanelThreadingTest_artefacts -type f -name PromptPanelThreadingTest | head -n 1)"
          if [ -z "$BIN" ]; then
            echo "PromptPanelThreadingTest binary not found" >&2
            exit 1
          fi
          timeout 300 xvfb-run -a "$BIN"

      # Decision (P3 "if TSan runtime in Actions is questionable"): RUN it, not
      # build-only. Rationale: the harness is cheap (~20 tiny JIT compiles +
      # a fixed 5 s window, well under a minute locally) and it is the only
      # execution-level check on ParamPool's double-buffer. The known TSan
      # blocker on modern runners (ASLR entropy: kernels with
      # vm.mmap_rnd_bits=32 crash TSan-instrumented binaries at startup) is
      # worked around with the standard sysctl below. If this step proves flaky
      # on real runners, demote it to build-only rather than continue-on-error.
      #
      # Expected stderr noise, NOT failures (see the header comment in
      # host/tests/ParamPoolConcurrencyTest.cpp): JUCE Timer/AsyncUpdater
      # assertion messages, LeakedObjectDetector reports at shutdown, and —
      # only if the FaustEngine activeUI TOCTOU (reported 2026-07-18) is still
      # unfixed at push time — Faust MapUI "setParamValue ... not found" lines.
      # Pass/fail is the exit code: TSAN_OPTIONS=halt_on_error=1 makes any data
      # race exit non-zero; "PASS" on stdout plus exit 0 is a clean run.
      - name: Run ParamPoolTsanTest under ThreadSanitizer
        run: |
          # TODO: VERIFY: sysctl workaround needed/sufficient on current
          # ubuntu-latest kernel — cannot be tested outside a real runner.
          sudo sysctl vm.mmap_rnd_bits=28
          # Located by find because JUCE artefact layout differs with
          # CMAKE_BUILD_TYPE: local evidence shows
          # <build>/ParamPoolTsanTest_artefacts/ParamPoolTsanTest with no config
          # subdir (empty build type); a Debug configure inserts a Debug/ level.
          BIN="$(find build-ci/ParamPoolTsanTest_artefacts -type f -name ParamPoolTsanTest | head -n 1)"
          if [ -z "$BIN" ]; then
            echo "ParamPoolTsanTest binary not found under build-ci/ParamPoolTsanTest_artefacts" >&2
            exit 1
          fi
          # timeout: harness has no hard bound if a JIT compile hangs; 300 s is
          # ~10x the expected wall time.
          TSAN_OPTIONS="halt_on_error=1" timeout 300 "$BIN"

