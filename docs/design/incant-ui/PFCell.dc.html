<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<div style="width:187px;height:95px;box-sizing:border-box;display:flex;flex-direction:column">
<div style="height:16px;display:flex;align-items:center;justify-content:center;font:600 12px 'Big Shoulders Display',sans-serif;color:#f5f0e6">{{ label }}</div>
<div style="flex:1;margin:4px;display:flex;align-items:center;gap:0">
<div style="flex:1;position:relative;height:6px">
<div style="position:absolute;inset:0;border-radius:3px;background:#0c0c0c"></div>
<div style="position:absolute;left:0;top:0;bottom:0;border-radius:3px;width:{{ pct }};background:{{ accent }}"></div>
<div style="position:absolute;top:50%;left:{{ pct }};width:14px;height:14px;margin:-7px 0 0 -7px;border-radius:50%;background:{{ accent }}"></div>
</div>
<div style="width:56px;height:16px;display:flex;align-items:center;justify-content:center;white-space:nowrap;overflow:hidden;font:400 11px 'Work Sans',sans-serif;color:#f5f0e6">{{ text }}</div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:187,&quot;height&quot;:95},&quot;label&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Drive&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;value&quot;:{&quot;editor&quot;:&quot;range&quot;,&quot;default&quot;:0.6,&quot;min&quot;:0,&quot;max&quot;:1,&quot;step&quot;:0.01,&quot;tsType&quot;:&quot;number&quot;},&quot;text&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;+6.4 dB&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;accent&quot;:{&quot;editor&quot;:&quot;color&quot;,&quot;default&quot;:&quot;#ffb03d&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;options&quot;:[&quot;#ff4b1f&quot;,&quot;#ffb03d&quot;,&quot;#d9542b&quot;,&quot;#ff7a45&quot;]}}">
class Component extends DCLogic {
  renderVals() {
    const v = Number(this.props.value ?? 0.5);
    return { pct: (v * 100).toFixed(1) + "%" };
  }
}
</script>
</body>
</html>
