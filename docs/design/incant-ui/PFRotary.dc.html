<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<div style="width:277px;height:95px;box-sizing:border-box;display:flex;flex-direction:column">
<div style="height:16px;display:flex;align-items:center;justify-content:center;font:600 12px 'Big Shoulders Display',sans-serif;color:#f5f0e6">{{ label }}</div>
<div style="flex:1;margin:4px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px">
<div style="width:48px;height:48px;position:relative">{{ dial }}</div>
<div style="width:64px;height:16px;display:flex;align-items:center;justify-content:center;font:400 11px 'Work Sans',sans-serif;color:#f5f0e6">{{ text }}</div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:277,&quot;height&quot;:95},&quot;label&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Cutoff&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;value&quot;:{&quot;editor&quot;:&quot;range&quot;,&quot;default&quot;:0.7,&quot;min&quot;:0,&quot;max&quot;:1,&quot;step&quot;:0.01,&quot;tsType&quot;:&quot;number&quot;},&quot;text&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;4.80 kHz&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;accent&quot;:{&quot;editor&quot;:&quot;color&quot;,&quot;default&quot;:&quot;#ff7a45&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;options&quot;:[&quot;#ff4b1f&quot;,&quot;#ffb03d&quot;,&quot;#d9542b&quot;,&quot;#ff7a45&quot;]}}">
class Component extends DCLogic {
  renderVals() {
    const v = Math.max(0, Math.min(1, Number(this.props.value ?? 0.5)));
    const accent = this.props.accent ?? "#ff7a45";
    // JUCE rotary parameters: 1.2π .. 2.8π (7 o'clock to 5 o'clock).
    const start = Math.PI * 1.2, end = Math.PI * 2.8;
    const r = 19, cx = 24, cy = 24;
    const pt = (a) => [cx + r * Math.sin(a), cy - r * Math.cos(a)];
    const arc = (a0, a1, colour, w) => {
      const [x0, y0] = pt(a0), [x1, y1] = pt(a1);
      const large = a1 - a0 > Math.PI ? 1 : 0;
      return React.createElement("path", {
        d: `M ${x0} ${y0} A ${r} ${r} 0 ${large} 1 ${x1} ${y1}`,
        stroke: colour, strokeWidth: w, fill: "none", strokeLinecap: "butt"
      });
    };
    const a = start + (end - start) * v;
    const [tx, ty] = pt(a);
    const [ix, iy] = [cx + (r - 8) * Math.sin(a), cy - (r - 8) * Math.cos(a)];
    const dial = React.createElement("svg", { width: 48, height: 48, viewBox: "0 0 48 48" },
      arc(start, end, "#0c0c0c", 8),
      v > 0.001 ? arc(start, a, accent, 8) : null,
      React.createElement("line", { x1: ix, y1: iy, x2: tx, y2: ty, stroke: "#f5f0e6", strokeWidth: 2 })
    );
    return { dial };
  }
}
</script>
</body>
</html>
